<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" contnet="Gabriel Naranjo" />
    <title>Evento Onclick (Core)</title>
    <link rel="stylesheet" href="static/css/style.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="titulo">The Art Gallery</h1>

      
      <div class="buscador-container">
        <input
          type="text"
          class="Publicación"
          placeholder="Buscar Publicación"
        />
      </div>
      <button id="Iniciar" class="boton">Iniciar Sesión</button>
    </header>

    <main class="principal">
      <section class="izquierda">
        <div class="contenedor">
       <img
       id="Pintura"
        src="static/images/campo-de-trigo-con-cipreses.png" 
        class="Imagen" 
        alt="Pintura">
       <p id="Texto" class = "Parrafo" >Campo de trigo con cipreses, Vicent van Gogh (1889)</p>
        </div>
      </section>
    </main>


    <script src="static/js/script.js"></script>
  </body>
</html>
