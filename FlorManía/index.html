<!doctype html>
<html lang="es">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="static/css/style.css">
    <title>Flormanía</title>
    </head>
    <body>
<header class="header">
  <!-- Barra superior principal -->
  <div class="top-bar">
    <h1 class="logo">FlorManía</h1>
    <nav class="nav">
      <button class="Boton">Envía Flores</button>
      <button class="Boton">Nosotros</button>
    </nav>
    <button class="Boton-login">Iniciar Sesión</button>
  </div>

  <!-- Subbarra con el cuadro gris justo debajo -->
  <nav class="Cuadros">
    <div class="Libro">
      <img class="caja" src="static/images/Libro.png" alt="Novelas" />
      <p>Novelas</p>
    </div>
    <div class="Libro">
      <img class="caja" src="static/images/ciencia.png" alt="Ciencia" />
      <p>Ciencia</p>
    </div>
    <div class="Libro">
      <img class="caja" src="static/images/Estatua.png" alt="Historia" />
      <p>Historia</p>
    </div>
    <div class="Libro">
      <img class="caja" src="static/images/PC.png" alt="Tecnología" />
      <p>Tecnología</p>
    </div>
    <div class="Libro">
      <img class="caja" src="static/images/Pintura.png" alt="Arte" />
      <p>Arte</p>
    </div>
    <div class="Libro">
      <img class="caja" src="static/images/oso.png" alt="Infantil" />
      <p>Infantil</p>
    </div>
  </nav>
</header>
</body>
<script src="static/js/script.js"></script>
</html>
