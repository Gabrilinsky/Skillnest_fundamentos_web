<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Bootstrap</title>
  <!-- CSS de Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <!-- Grupo de botones o menú desplegable -->
  <div class="btn-group">
    <button class="btn btn-success dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
      Pa...
    </button>
    <ul class="dropdown-menu">
      <li><a href="#" class="dropdown-item">Chinazo</a></li>
      <li><a href="#" class="dropdown-item">Mi pana</a></li>
      <li><a href="#" class="dropdown-item">Naguara</a></li>
    </ul>
  </div>

  <!-- JS de Bootstrap (necesario para que el dropdown funcione al hacer clic) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
